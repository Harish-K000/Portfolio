<section class="contact-section" aria-labelledby="contact-title">
    <div class="contact-card">
        <h1 id="contact-title">Let&rsquo;s Connect</h1>
        <p class="intro-copy">
            I&rsquo;d love to hear about your goals or upcoming projects. Drop a message below and I&rsquo;ll get back to you soon.
        </p>

        <form class="contact-form" (ngSubmit)="sendMessage()" #contactForm="ngForm">
            <label for="toEmail">Email</label>
            <input id="toEmail" type="email" [value]="email" readonly aria-readonly="true">

            <label for="message">Message</label>
            <textarea id="message" name="message" [(ngModel)]="message" rows="6" placeholder="Type your message here..." required></textarea>

            <button type="submit" [disabled]="!message.trim()">Send</button>
        </form>

        <a class="direct-email" [href]="'mailto:' + email">Prefer email? {{ email }}</a>
    </div>
</section>
